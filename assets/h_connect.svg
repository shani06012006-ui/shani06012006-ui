<line x1="419" y1="34" x2="880" y2="34" stroke="#1e293b" stroke-width="2"/>
<g clip-path="url(#c)"><rect x="419" y="33" width="140" height="2" fill="url(#line)" class="sweep"/></g>
<polygon points="902,34 894,26 886,34 894,42" fill="#38bdf8"/></g>

