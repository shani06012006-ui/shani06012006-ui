<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="footer">
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121a36"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#6366f1" stop-opacity=".9"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2"><stop offset="0" stop-color="#38bdf8" stop-opacity=".9"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>

</defs>
<style>
.sans{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeup .9s ease both}
@keyframes dash{to{stroke-dashoffset:-1000}}
.dash{stroke-dasharray:140 860;animation:dash 5s linear infinite}
@keyframes pulse{0%,100%{opacity:.30}50%{opacity:.65}}
.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes floaty{0%{transform:translateY(0);opacity:0}20%{opacity:.55}100%{transform:translateY(-140px);opacity:0}}
.floaty{animation:floaty 7s linear infinite}
@keyframes scan{from{transform:translateY(-10px)}to{transform:translateY(340px)}}
.scan{animation:scan 6s linear infinite}
@keyframes reveal{to{transform:translateX(var(--w))}}
@keyframes sweep{from{transform:translateX(-200px)}to{transform:translateX(1000px)}}
.sweep{animation:sweep 4s ease-in-out infinite}
</style>
<rect width="1000" height="220" rx="14" fill="#0b1020"/>

<defs><linearGradient id="wv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#0b3a8a"/></linearGradient></defs>
<path d="M0 150 Q 125.0 128 250.0 150 T 500.0 150 T 750.0 150 T 1000.0 150 T 1250.0 150 T 1500.0 150 T 1750.0 150 T 2000.0 150 T 2250.0 150 V220 H0 Z" fill="url(#wv)" opacity="0.35"><animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/></path>
<path d="M0 168 Q 100.0 150 200.0 168 T 400.0 168 T 600.0 168 T 800.0 168 T 1000.0 168 T 1200.0 168 T 1400.0 168 T 1600.0 168 T 1800.0 168 T 2000.0 168 T 2200.0 168 V220 H0 Z" fill="url(#wv)" opacity="0.55"><animateTransform attributeName="transform" type="translate" from="-400 0" to="0 0" dur="6s" repeatCount="indefinite"/></path>
<path d="M0 186 Q 125.0 172 250.0 186 T 500.0 186 T 750.0 186 T 1000.0 186 T 1250.0 186 T 1500.0 186 T 1750.0 186 T 2000.0 186 T 2250.0 186 V220 H0 Z" fill="#0b1020" opacity="1"><animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="12s" repeatCount="indefinite"/></path>
<text x="500" y="70" text-anchor="middle" class="sans" font-size="20" font-style="italic" fill="#e2e8f0">Transforming complex logic into clean, scalable code.</text>
<line x1="440" y1="92" x2="560" y2="92" stroke="url(#line)" stroke-width="2"/>
<text x="500" y="118" text-anchor="middle" class="mono" font-size="12" letter-spacing="4" fill="#64748b">SHANIYA S  //  FULL STACK SOFTWARE ENGINEER</text>

</svg>
