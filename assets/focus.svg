="#1e293b" stroke-width="1.2"/><rect x="1" y="157" width="468" height="140" rx="18" fill="none" stroke="url(#acc)" stroke-width="2" pathLength="1000" class="dash"/><circle cx="59" cy="227" r="34" fill="#0b1020" stroke="url(#acc)" stroke-width="2"/><circle cx="59" cy="227" r="42" fill="none" stroke="#38bdf8" stroke-opacity=".18" stroke-dasharray="3 6"/><text x="59" y="233" text-anchor="middle" class="mono" font-size="18" font-weight="800" fill="#38bdf8">&lt;/&gt;</text><text x="119" y="209" class="sans" font-size="19" font-weight="700" fill="#f8fafc">Frontend Craftsmanship</text><rect x="119" y="219" width="36" height="3" rx="1.5" fill="url(#acc)"/><text x="119" y="247" class="sans" font-size="12.5" fill="#94a3b8">Dynamic, reusable React.js components with Tailwind</text><text x="119" y="267" class="sans" font-size="12.5" fill="#94a3b8">CSS for smooth, responsive user experiences.</text><rect x="491" y="157" width="468" height="140" rx="18" fill="url(#card)" stroke="#1e293b" stroke-width="1.2"/><rect x="491" y="157" width="468" height="140" rx="18" fill="none" stroke="url(#acc)" stroke-width="2" pathLength="1000" class="dash"/><circle cx="549" cy="227" r="34" fill="#0b1020" stroke="url(#acc)" stroke-width="2"/><circle cx="549" cy="227" r="42" fill="none" stroke="#38bdf8" stroke-opacity=".18" stroke-dasharray="3 6"/><text x="549" y="233" text-anchor="middle" class="mono" font-size="18" font-weight="800" fill="#38bdf8">AI</text><text x="609" y="209" class="sans" font-size="19" font-weight="700" fill="#f8fafc">AI-Powered Workflow</text><rect x="609" y="219" width="36" height="3" rx="1.5" fill="url(#acc)"/><text x="609" y="247" class="sans" font-size="12.5" fill="#94a3b8">Claude, DeepSeek, Gemini and ChatGPT for rapid</text><text x="609" y="267" class="sans" font-size="12.5" fill="#94a3b8">prototyping, query tuning and less boilerplate.</text>
