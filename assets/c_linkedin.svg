<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<radialGradient id="o"><stop offset="0" stop-color="#38bdf8" stop-opacity=".7"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
</defs>
<style>
@keyframes s{to{transform:rotate(360deg)}}
@keyframes p{0%,100%{opacity:.25}50%{opacity:.6}}
.r{transform-box:fill-box;transform-origin:center;animation:s 3s linear infinite}
.p{animation:p 3s ease-in-out infinite}
</style>
<circle cx="48" cy="48" r="46" fill="url(#o)" class="p"/>
<circle cx="48" cy="48" r="36" fill="#0b1020" stroke="#1e293b" stroke-width="2"/>
<circle cx="48" cy="48" r="36" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 156" class="r"/>
<rect x="33" y="33" width="30" height="30" rx="7" fill="#0a66c2"/>
<text x="48" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#fff">in</text>
</svg>
