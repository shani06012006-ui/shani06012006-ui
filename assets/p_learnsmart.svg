<svg xmlns="http://www.w3.org/2000/svg" width="470" height="420" viewBox="0 0 470 420" role="img" aria-label="p_learnsmart">
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121a36"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#6366f1" stop-opacity=".9"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2"><stop offset="0" stop-color="#38bdf8" stop-opacity=".9"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>

</defs>
<style>
.sans{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeup .9s ease both}
@keyframes dash{to{stroke-dashoffset:-1000}}
.dash{stroke-dasharray:140 860;animation:dash 5s linear infinite}
@keyframes pulse{0%,100%{opacity:.30}50%{opacity:.65}}
.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes floaty{0%{transform:translateY(0);opacity:0}20%{opacity:.55}100%{transform:translateY(-140px);opacity:0}}
.floaty{animation:floaty 7s linear infinite}
@keyframes scan{from{transform:translateY(-10px)}to{transform:translateY(340px)}}
.scan{animation:scan 6s linear infinite}
@keyframes reveal{to{transform:translateX(var(--w))}}
@keyframes sweep{from{transform:translateX(-200px)}to{transform:translateX(1000px)}}
.sweep{animation:sweep 4s ease-in-out infinite}
</style>

<rect x="1" y="1" width="468" height="418" rx="20" fill="url(#card)" stroke="#1e293b" stroke-width="1.2"/><rect x="1" y="1" width="468" height="418" rx="20" fill="none" stroke="url(#acc)" stroke-width="2" pathLength="1000" class="dash"/><text x="30" y="46" class="mono" font-size="12" letter-spacing="4" fill="#38bdf8">PROJECT 01</text><circle cx="436" cy="42" r="5" fill="#22c55e" class="blink"/><text x="30" y="92" class="sans" font-size="32" font-weight="800" fill="url(#txt)">Learn-Smart</text><text x="30" y="118" class="sans" font-size="15" font-weight="600" fill="#a5b4fc">AI-Integrated Learning Platform</text><line x1="30" y1="138" x2="438" y2="138" stroke="url(#line)" stroke-width="1.5"/><text x="30" y="166" class="sans" font-size="13" font-style="italic" fill="#cbd5e1">An adaptive learning platform delivering personalized</text><text x="30" y="185" class="sans" font-size="13" font-style="italic" fill="#cbd5e1">and interactive learning workflows.</text><polygon points="30,212 38,216 30,220" fill="#38bdf8"/><text x="48" y="222" class="sans" font-size="12.5" fill="#94a3b8">Built with Python, Django and React: 3+ scalable</text><text x="48" y="240" class="sans" font-size="12.5" fill="#94a3b8">modules and 5+ adaptive features.</text><polygon points="30,272 38,276 30,280" fill="#38bdf8"/><text x="48" y="282" class="sans" font-size="12.5" fill="#94a3b8">Designed 10+ REST APIs and refactored ORM queries,</text><text x="48" y="300" class="sans" font-size="12.5" fill="#94a3b8">cutting database latency by 15-20%.</text><polygon points="30,332 38,336 30,340" fill="#38bdf8"/><text x="48" y="342" class="sans" font-size="12.5" fill="#94a3b8">Integrated backend AI services into responsive React</text><text x="48" y="360" class="sans" font-size="12.5" fill="#94a3b8">dashboards styled with Tailwind CSS.</text><line x1="30" y1="382" x2="438" y2="382" stroke="#1e293b" stroke-width="1.5"/><text x="30" y="404" class="mono" font-size="11.5" letter-spacing="2" fill="#38bdf8">PYTHON  /  DJANGO  /  REACT  /  TAILWIND</text>
</svg>
